services:
  pendiva-demo:
    build: .
    container_name: pendiva-demo
    restart: unless-stopped
    environment:
      - WHATSAPP_VERIFY_TOKEN
      - WHATSAPP_APP_SECRET
      - WHATSAPP_PHONE_NUMBER_ID
      - MODEL_API_KEY
      - PENDIVA_AI_PROVIDER
      - NVIDIA_API_KEY
      - NEBIUS_API_KEY
      - PENDIVA_AUTH_PASSWORD
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - pendiva_demo_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  pendiva_demo_data:
